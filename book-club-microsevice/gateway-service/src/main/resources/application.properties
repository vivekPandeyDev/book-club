management.endpoints.web.exposure.include=openapi, swagger-ui


# ===============================
# JWT Configuration
# ===============================
jwt.open-id-name=keycloak
jwt.open-id-url=http://${OPEN_ID_HOST}:${OPEN_ID_PORT}/realms/auth-server/.well-known/openid-configuration
jwt.auth.converter.resource-id=${JWT_RESOURCE_ID}
jwt.auth.converter.principle-attribute=preferred_username

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# SpringDoc API Documentation
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.oauth.client-id=${JWT_RESOURCE_ID}
springdoc.swagger-ui.oauth.client-secret=${JWT_RESOURCE_SECRET}
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[0].name=API Gateway Service
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=User Service

# ===============================
# Spring Security OAuth2 Resource Server
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# ===============================
# Application Configuration
# ===============================
spring.application.name=gateway-service
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===============================
# Spring Cloud Gateway Routes
# ===============================
spring.cloud.gateway.routes[0].id=USER-SERVICE
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=USER-SERVICE-SWAGGER
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.routes[1].filters[0]=SetPath=/v3/api-docs


# ===============================
# Spring Cloud Config Server
# ===============================
spring.config.import=configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8083}

