# Server Configuration
server.port=8081
# Spring Configuration
spring.application.name=user-service

# ===============================
# JWT Configuration
# ===============================
jwt.open-id-security-name=keycloak
jwt.open-id-uri=http://${OPEN_ID_HOST}:9090/realms/auth-server/.well-known/openid-configuration

# ===============================
# Keycloak Configuration
# ===============================
auth.keycloak.config.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
auth.keycloak.config.default-role=user
auth.keycloak.config.realm=${KEYCLOAK_REALM}
auth.keycloak.config.domain=${KEYCLOAK_DOMAIN}
auth.keycloak.config.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
auth.keycloak.config.admin-client-secret=${KEYCLOAK_CLIENT_SECRET}

# ===============================
# SpringDoc Configuration
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=oauth-user-group-1

# ===============================
# Multipart Upload
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Spring DataSource
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/book-club}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-19

# ===============================
# Hibernate Configuration
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JPA Logging (Optional for debugging)
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Pagination and Sorting Defaults
# ===============================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ===============================
# Redis Configuration
# ===============================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# Message Configuration
# ===============================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================
# MinIO Config
# ===============================
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=book-club

# Spring Cloud Config Server
spring.config.import=configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8083}
