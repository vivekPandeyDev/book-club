
services:

  minio:
    image: minio/minio
    container_name: minio-app
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./docker/minio:/data
    networks:
      - app_global
      
  postgresql:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: book-club
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
    networks:
      - app_global

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    ports:
      - "9090:${KEYCLOAK_PORT}"
    environment:
      KEYCLOAK_LOGLEVEL: TRACE
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,address=8787,server=y,suspend=n"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL:  jdbc:postgresql://postgresql:5432/book-club
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_IMPORT: /opt/keycloak/data/import/realm-export.json
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    command: start-dev  --import-realm --verbose
    depends_on:
      - postgresql
    networks:
      - app_global

  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: password
    networks:
      - app_global
    volumes:
      - ./docker/redis:/data

  kafka:
    image: wurstmeister/kafka:latest
    restart: always
    ports:
      - "9092:9092"  # External port for your local application
      - "9093:9093"  # Internal port for communication between Docker containers
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - app_global
    volumes:
      - ./docker/event/kafka:/var/lib/kafka/data

  zookeeper:
    image: wurstmeister/zookeeper:latest
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app_global
    volumes:
      - ./docker/event/zookeeper:/var/lib/zookeeper/data

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - app_global

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    ports:
      - "${CONFIG_SERVICE_PORT}:${CONFIG_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: ${CONFIG_SERVICE_PORT}
      SPRING_EUREKA_CLIENT_URL: ${SPRING_EUREKA_CLIENT_URL}
    depends_on:
      - registry-service
      - zipkin
    networks:
      - app_global

  registry-service:
    build:
      context: .
      dockerfile: registry-service/Dockerfile
    ports:
      - "${REGISTRY_SERVICE_PORT}:${REGISTRY_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: ${REGISTRY_SERVICE_PORT}
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
    networks:
      - app_global

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: ${GATEWAY_SERVICE_PORT}
      SPRING_EUREKA_CLIENT_URL: ${SPRING_EUREKA_CLIENT_URL}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_RESOURCE_ID: ${JWT_RESOURCE_ID}
      OPEN_ID_HOST: ${OPEN_ID_HOST}
      OPEN_ID_PORT: ${OPEN_ID_PORT}
      JWT_RESOURCE_SECRET: ${JWT_RESOURCE_SECRET}
    networks:
      - app_global
    depends_on:
      - registry-service

networks:
  app_global:
    driver: bridge
